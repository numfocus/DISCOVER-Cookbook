<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>404 - Page Not Found | DISCOVER Cookbook</title>
  <style>
    :root {
      --bg: #eef3ff;
      --blob-1: #6f8cff; --blob-2: #2fd4c0; --blob-3: #b78cff;
      --blob-opacity: .55;
      --surface: rgba(255,255,255,.72);
      --border: rgba(40,60,130,.16);
      --text: #101a35;
      --muted: #44506d;
      --accent: #2f4fd0;
      --accent-hover: #2140b5;
      --accent-text: #fff;
      --g1: #2f4fd0; --g2: #12b8aa; --g3: #8a5cf6;
      --shadow: 0 30px 80px -30px rgba(30,45,110,.45);
      --focus: #b45309;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #070b18;
        --blob-opacity: .38;
        --surface: rgba(14,22,42,.72);
        --border: rgba(160,185,255,.2);
        --text: #f1f5ff;
        --muted: #aab6d6;
        --accent: #9db2ff;
        --accent-hover: #bccaff;
        --accent-text: #0a1020;
        --g1: #9db2ff; --g2: #3ddbc8; --g3: #c4a2ff;
        --shadow: 0 30px 80px -30px rgba(0,0,0,.8);
        --focus: #fbbf24;
      }
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: max(1.25rem, env(safe-area-inset-top)) 1.25rem max(1.25rem, env(safe-area-inset-bottom));
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* aurora background */
    .aurora { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
    .aurora i {
      position: absolute; border-radius: 50%;
      width: 46vmax; height: 46vmax;
      filter: blur(90px); opacity: var(--blob-opacity);
      animation: float 22s ease-in-out infinite alternate;
    }
    .aurora i:nth-child(1) { background: var(--blob-1); top: -18%; left: -12%; }
    .aurora i:nth-child(2) { background: var(--blob-2); bottom: -22%; right: -10%; animation-duration: 28s; animation-delay: -6s; }
    .aurora i:nth-child(3) { background: var(--blob-3); top: 30%; left: 45%; width: 32vmax; height: 32vmax; animation-duration: 34s; animation-delay: -12s; }
    @keyframes float { to { transform: translate(7vw, 6vh) scale(1.15); } }
    .aurora::after {
      content: ""; position: absolute; inset: 0;
      background-image: radial-gradient(var(--border) 1px, transparent 1px);
      background-size: 30px 30px;
      -webkit-mask-image: radial-gradient(ellipse at center, #000 10%, transparent 70%);
      mask-image: radial-gradient(ellipse at center, #000 10%, transparent 70%);
    }

    main {
      position: relative;
      width: min(100%, 38rem);
      padding: clamp(2rem, 6vw, 3.5rem) clamp(1.25rem, 6vw, 3.25rem);
      text-align: center;
      background: var(--surface);
      border-radius: 32px;
      box-shadow: var(--shadow);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      backdrop-filter: blur(20px) saturate(140%);
    }
    main::before {
      content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none;
      background: linear-gradient(135deg, var(--g1), transparent 40%, transparent 60%, var(--g2));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
    }

    .code {
      direction: ltr;
      display: flex; align-items: center; justify-content: center;
      gap: clamp(.15rem, 1.5vw, .6rem);
      font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
      font-weight: 700;
      font-size: clamp(5rem, 24vw, 8.5rem);
      line-height: 1; letter-spacing: -.04em;
      margin-bottom: 1.5rem;
    }
    .code span {
      color: var(--g1);
      background: linear-gradient(160deg, var(--g1), var(--g3) 55%, var(--g2));
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 8px 24px color-mix(in srgb, var(--g1) 35%, transparent));
    }
    .code svg { width: .86em; height: .86em; overflow: visible; filter: drop-shadow(0 8px 24px color-mix(in srgb, var(--g2) 40%, transparent)); }
    .ring-track { fill: none; stroke: var(--border); stroke-width: 8; }
    .ring-draw {
      fill: none; stroke: url(#rg); stroke-width: 8; stroke-linecap: round;
      stroke-dasharray: 289; stroke-dashoffset: 289;
      transform: rotate(-90deg); transform-origin: 50% 50%;
      animation: draw 1.8s cubic-bezier(.65,0,.25,1) .2s forwards;
    }
    .orbit { transform-origin: 50% 50%; animation: spin 9s linear infinite; }
    .orbit circle { fill: var(--g2); }
    .core { fill: url(#rg); }
    @keyframes draw { to { stroke-dashoffset: 60; } }
    @keyframes spin { to { transform: rotate(360deg); } }

    h1 {
      font-family: Georgia, "Iowan Old Style", "Times New Roman", "Noto Serif", serif;
      font-size: clamp(1.6rem, 5.5vw, 2.25rem);
      line-height: 1.2; margin-bottom: .75rem;
    }
    .lead { font-size: 1.1rem; margin-bottom: .4rem; }
    .sub { color: var(--muted); max-width: 30rem; margin: 0 auto 2rem; }

    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: .75rem; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 50px; padding: .7rem 1.6rem; border-radius: 999px;
      font: inherit; font-weight: 600; text-decoration: none;
      border: 2px solid transparent;
      transition: transform .2s, box-shadow .2s, background-color .2s, color .2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 60%, var(--g2)));
      color: var(--accent-text);
      box-shadow: 0 10px 28px -10px var(--accent);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 14px 32px -10px var(--accent); }
    .btn-ghost { color: var(--accent); border-color: var(--accent); background: transparent; }
    .btn-ghost:hover { background: var(--accent); color: var(--accent-text); }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

    /* language search input */
    .lang { position: relative; width: min(100%, 20rem); margin: 2.25rem auto 0; }
    .lang svg { position: absolute; inset-inline-start: 1rem; top: 50%; translate: 0 -50%; width: 20px; height: 20px; color: var(--accent); pointer-events: none; }
    .lang input {
      width: 100%; min-height: 50px;
      padding-block: 0 0; padding-inline: 2.9rem 1rem;
      border-radius: 999px; border: 1.5px solid var(--border);
      background: color-mix(in srgb, var(--surface) 70%, transparent);
      color: var(--text); font: inherit; font-weight: 600;
      transition: border-color .2s, box-shadow .2s;
    }
    .lang input::placeholder { color: var(--muted); font-weight: 500; }
    .lang input:hover { border-color: var(--accent); }
    .lang input:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 30%, transparent); }

    .footer { margin-top: 1.5rem; color: var(--muted); font-size: .95rem; }

    @media (max-width: 440px) { .actions { flex-direction: column; } .btn { width: 100%; } }
    @media (prefers-reduced-motion: reduce) {
      .aurora i, .orbit { animation: none; }
      .ring-draw { animation: none; stroke-dashoffset: 60; }
      .btn { transition: none; }
    }
  </style>
</head>

      ko: ["한국어","Korean","페이지를 찾을 수 없습니다","찾으시는 페이지를 찾을 수 없습니다.","이동되었거나 이름이 바뀌었거나 삭제되었을 수 있습니다. 홈으로 돌아가거나 알려 주세요.","홈으로 돌아가기","문제 신고","오류라고 생각하시나요? 이슈를 등록해 주세요.","언어 검색…","언어"],

    const $ = (id) => document.getElementById(id);
    const input = $("lang-input");
    let current = "en";

    function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    const has = (c) => Object.prototype.hasOwnProperty.call(L, c);

    function detectLanguage() {
      const pathLang = location.pathname.split("/")[1];
      let refLang = "";
      try { refLang = new URL(document.referrer || "", location.origin).pathname.split("/")[1]; } catch (e) {}
      const candidates = [pathLang, refLang, safeGet("preferredLang"), (navigator.language || "en").slice(0, 2)];
      return candidates.find(has) || "en";
    }

    function applyLanguage(code) {
      const t = L[code];
      current = code;
      document.documentElement.lang = code;
      document.documentElement.dir = t[10] ? "rtl" : "ltr";
      document.title = "404 - " + t[2] + " | DISCOVER Cookbook";
      $("title").textContent = t[2];
      $("message").textContent = t[3];
      $("suggestion").textContent = t[4];
      $("home").textContent = t[5];
      $("report").textContent = t[6];
      $("footer").textContent = t[7];
      input.placeholder = t[8];
      input.setAttribute("aria-label", t[9] + " (" + t[1] + ")");
      input.value = t[0];
      safeSet("preferredLang", code);
    }

    /* fill the language list */
    const list = $("lang-list");
    Object.keys(L).forEach(function (c) {
      const o = document.createElement("option");
      o.value = L[c][0];
      o.label = L[c][1];
      list.appendChild(o);
    });

    /* match by native name, English name, or code (exact first, then prefix) */
    function findLang(q) {
      q = q.trim().toLowerCase();
      if (!q) return null;
      const keys = Object.keys(L);
      return keys.find(function (c) { return c === q || L[c][0].toLowerCase() === q || L[c][1].toLowerCase() === q; })
          || keys.find(function (c) { return L[c][0].toLowerCase().startsWith(q) || L[c][1].toLowerCase().startsWith(q); })
          || null;
    }

    input.addEventListener("focus", function () { input.value = ""; });
    input.addEventListener("blur", function () { if (!input.value.trim()) input.value = L[current][0]; });
    input.addEventListener("change", function () {
      const code = findLang(input.value);
      applyLanguage(code || current);
    });
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") { input.blur(); } });

    applyLanguage(detectLanguage());
  </script>
